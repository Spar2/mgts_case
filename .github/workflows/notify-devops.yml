name: Notify Discord - devops

permissions:
  contents: read

on:
  push:
    branches: [devops]

jobs:
  discord-notify:
    # Discord недоступен из домашнего LAN (блок на уровне провайдера) —
    # уведомления остаются на github-hosted. Self-hosted только для джобов
    # без внешних вебхуков.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Relay-переключатель: пусто = legacy (прямой webhook, без даунтайма).
      # Задать vars.NOTIFY_VIA_RELAY=1 + vars.RELAY_URL для перехода на relay.
      NOTIFY_VIA_RELAY: ${{ vars.NOTIFY_VIA_RELAY }}
      RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - name: Send Discord notification
        if: always() && (env.NOTIFY_VIA_RELAY == '' || env.RELAY_URL == '')
        env:
          # Заглушка: задайте в GitHub -> Settings -> Secrets and variables -> Actions
          # секрет с именем DISCORD_WEBHOOK_DEVOPS (URL вебхука Discord, БЕЗ /github на конце)
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVOPS }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          COMPARE: ${{ github.event.compare }}
        run: |
          # Не падать, если секрет ещё не задан (режим заглушки)
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg ref "$REF_NAME" \
            --arg actor "$ACTOR" \
            --arg sha "$SHA" \
            --arg compare "$COMPARE" \
            --arg username "GitHub • devops" \
            '{embeds: [{title: "Push в ветку `devops`", description: "**Репозиторий:** \($repo)\n**Ветка:** `\($ref)`\n**Автор пуша:** \($actor)\n**Коммит:** `\($sha)`\n[Смотреть изменения](\($compare))", color: 16746496}], username: $username}')
          curl -fsSL -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Send notification via relay
        if: always() && env.NOTIFY_VIA_RELAY != '' && env.RELAY_URL != ''
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg source "notify-devops" \
            --arg title "Push в ветку devops" \
            --arg repo "${{ github.repository }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "${{ github.sha }}" \
            --arg compare "${{ github.event.compare }}" \
            '{source: $source, title: $title, repository: $repo, ref_name: $ref, actor: $actor, sha: $sha, compare: $compare}')
          echo "$payload" | jq .
          curl -sSL --fail -X POST "$RELAY_URL" \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"
