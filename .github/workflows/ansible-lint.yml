name: Ansible lint

permissions:
  contents: read

on:
  push:
    branches: [devops]
    paths: ["ansible/**", ".github/workflows/ansible-lint.yml"]
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible-lint.yml"]
  workflow_dispatch:

concurrency:
  group: ansible-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, team-devops]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Guard branch ref
        uses: ./.github/actions/guard-ref
        with:
          ref_name: ${{ github.ref_name }}
          event_name: ${{ github.event_name }}
          fork: ${{ github.event.pull_request.head.repo.fork }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint playbooks
        working-directory: ansible
        run: ansible-lint playbooks/site.yml playbooks/deploy.yml playbooks/runners.yml playbooks/kvm.yml playbooks/data-stand.yml

      - name: Lint shell scripts
        # github-hosted: shellcheck через apt (есть sudo).
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning ansible/*.sh

# Результат этого рана уходит в Discord через notify-runs.yml (workflow_run).
