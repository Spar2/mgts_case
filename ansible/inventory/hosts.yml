---
all:
  children:
    staging:
      hosts:
        # Xeon-ВМ, Ubuntu 24.04. Коннект только сюда.
        # Адрес берётся из staging_lan_ip: дефолт в group_vars, локально
        # перекрывается файлом inventory/host_vars/xeon-staging/local.yml
        # (он в .gitignore и никогда не коммитится).
        xeon-staging:
          ansible_host: "{{ staging_lan_ip }}"
          ansible_user: hakloboss
          ansible_port: 22
    runners:
      hosts:
        # ВМ self-hosted раннеров на самом Xeon (br0, DHCP).
        # Долгосрочно — резервация .100-.102 на роутере; пока правим руками.
        run-devops:
          ansible_host: 192.168.1.100
        run-web:
          ansible_host: 192.168.1.101
        run-ml:
          ansible_host: 192.168.1.102
    kvm:
      hosts:
        # NanoKVM: только LAN (у админской ВМ нет tailnet).
        # Пароль root меняется — передаётся рантаймом, в репо его нет.
        kvm-2354:
          ansible_host: 192.168.1.4
          ansible_user: root
          ansible_port: 22
