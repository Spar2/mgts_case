---
- name: Tailscale | Ubuntu — ключ репозитория
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/{{ tailscale_apt_distro }}/{{ tailscale_apt_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  when: ansible_facts.os_family == "Debian"

- name: Tailscale | Ubuntu — репозиторий
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/{{ tailscale_apt_distro }}
      {{ tailscale_apt_release }} main
    state: present
  when: ansible_facts.os_family == "Debian"

- name: Tailscale | Ubuntu — установка
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Tailscale | каталог под drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d
    state: directory
    mode: "0755"
  when: tailscale_force_noise_443 | bool

- name: Tailscale | форсировать noise поверх TCP 443 (drop-in, вместо S97-хака)
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscaled.service.d/force-noise-443.conf
    mode: "0644"
    content: |
      [Service]
      Environment=TS_FORCE_NOISE_443=1
  notify: Restart tailscaled
  when: tailscale_force_noise_443 | bool

- name: Tailscale | включить и запустить tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Tailscale | проверить статус
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Tailscale | подключиться (tailscale up)
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --auth-key={{ tailscale_auth_key }}
      - --hostname={{ tailscale_hostname }}
  no_log: true
  register: tailscale_up
  changed_when: "'Success' in tailscale_up.stdout or tailscale_up.rc == 0"
  when:
    - tailscale_auth_key | length > 0
    - "'Logged out' in tailscale_status.stdout or tailscale_status.rc != 0"

- name: Tailscale | нет ключа — пропуск с предупреждением
  ansible.builtin.debug:
    msg: "TAILSCALE_AUTH_KEY пуст — tailscale up пропущен. Задай секрет и перезапусти."
  when: tailscale_auth_key | length == 0
