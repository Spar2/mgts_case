---
- name: Docker | Ubuntu — зависимости
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Docker | Ubuntu — ключ репозитория
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ docker_apt_distro }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_facts.os_family == "Debian"

- name: Docker | Ubuntu — репозиторий
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_deb_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ docker_apt_distro }}
      {{ ansible_facts.distribution_release }} stable
    state: present
  when: ansible_facts.os_family == "Debian"

- name: Docker | Ubuntu — установка
  ansible.builtin.apt:
    name: "{{ docker_packages_ubuntu }}"
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Docker | включить и запустить docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Docker | добавить пользователей в группу docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Docker | версии
  ansible.builtin.command: "{{ item }}"
  loop:
    - docker --version
    - docker compose version
  register: docker_vers
  changed_when: false

- name: Docker | показать версии
  ansible.builtin.debug:
    msg: "{{ docker_vers.results | map(attribute='stdout') | list }}"
