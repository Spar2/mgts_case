---
# Роль hardening: базовая защита стенда. Порядок важен: sshd и фаервол
# меняют доступ — роль стоит ПОСЛЕДНЕЙ в site.yml, прогон идёт по частям
# (--tags sshd, затем firewall, затем updates) с проверкой SSH между ними.
# План Б при lockout: KVM-консоль.
# Честные оговорки:
# - docker пишет свои iptables поверх UFW (известный зазор docker+ufw):
#   опубликованные контейнерами порты UFW не фильтрует. Граница — не
#   светить лишнего в compose (bind 127.0.0.1, где можно).
# - авторебут после обновлений ВЫКЛЮЧЕН осознанно: перезагрузка убивает
#   CI-джобы и ВМ (libvirt поднимет их сам, джобы — нет).

# fail2ban: свои сети не банить (пример: ["127.0.0.1/8"]). Реальные IP
# задавать только через group_vars/host_vars, не в репо.
hardening_fail2ban_ignoreip: ["127.0.0.1/8"]
