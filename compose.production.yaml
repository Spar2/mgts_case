# Local TLS acceptance configuration; external publication is a separate stage.
services:
  web:
    ports: !override ["127.0.0.1:${DTS_TLS_PORT:-8443}:443"]
    environment:
      DTS_PUBLIC_HOST: ${DTS_PUBLIC_HOST:?Set the exact HTTPS hostname}
      DTS_PUBLIC_ORIGIN: ${DTS_PUBLIC_ORIGIN:?Set exact HTTPS origin including nonstandard port}
    volumes:
      - ./ops/web/nginx-production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${DTS_TLS_DIRECTORY:?Set certificate directory}:/etc/nginx/tls:ro
    networks:
      default: {ipv4_address: 172.30.89.10}
  api:
    environment:
      DTS_ENV: production
      DTS_SECURE_COOKIES: "true"
      DTS_ALLOWED_HOSTS: ${DTS_PUBLIC_HOST},${DTS_PUBLIC_EXTRA_HOSTS:-},127.0.0.1,localhost
      DTS_ALLOWED_ORIGINS: ${DTS_PUBLIC_ORIGIN},${DTS_PUBLIC_EXTRA_ORIGIN:-}
      FORWARDED_ALLOW_IPS: 172.30.89.10
    command: [python, -m, uvicorn, workbench.api:app, --host, 0.0.0.0, --port, "8091", --proxy-headers, --no-access-log]
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  backup:
    profiles: [maintenance]
    build: {context: ., dockerfile: services/web-api/Dockerfile}
    command: [python, -m, workbench.backup_job, --daily]
    environment:
      DTS_DATABASE_URL: postgresql://workbench:${DTS_POSTGRES_PASSWORD}@postgres:5432/workbench
      DTS_RUNTIME: /runtime
      DTS_BACKUP_ROOT: /backups
      DTS_BACKUP_RECIPIENT: ${DTS_BACKUP_RECIPIENT:-}
    volumes:
      - workbench-runtime:/runtime
      - ${DTS_BACKUP_DIRECTORY:-./.runtime/backups}:/backups
    tmpfs: ["/tmp:size=256m,mode=1777"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  default:
    ipam:
      config: [{subnet: 172.30.89.0/24}]
